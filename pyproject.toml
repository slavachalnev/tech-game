[project]
name = "tech-game"
version = "0.1.0"
description = "A time-travel invention game refereed by Claude Code"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "playwright>=1.50"]

[project.scripts]
tg = "engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # never the saves: a Fermi script can be named like a test
