<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="ink" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <!-- chain lines of laid paper -->
    <pattern id="laid" width="26" height="10" patternUnits="userSpaceOnUse">
      <line x1="13" y1="0" x2="13" y2="10" stroke="#7a6a55" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#7a6a55" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Address side -->
  <g transform="rotate(-3 210 260)">
    <g filter="url(#ink)" stroke="#2b2118" stroke-linejoin="round">
      <rect x="45" y="155" width="340" height="220" fill="none" stroke="#7a6a55" stroke-width="1.2"/>
      <rect x="40" y="150" width="340" height="220" fill="#f8f1e1" stroke-width="2"/>
      <rect x="40" y="150" width="340" height="220" fill="url(#laid)" stroke="none"/>
      <path d="M160,318 q40,8 80,-2 t70,4" fill="none" stroke-width="1"/>
    </g>
    <g fill="#2b2118" font-style="italic" font-size="23">
      <text x="64" y="222">To Mr Nicholas Penrose,</text>
      <text x="80" y="262">Treasurer of Wheal Fortune,</text>
      <text x="168" y="302">at Redruth</text>
    </g>
  </g>

  <!-- Seal side -->
  <g transform="rotate(4 600 265)">
    <g filter="url(#ink)" stroke="#2b2118" stroke-linejoin="round" fill="none">
      <rect x="435" y="160" width="340" height="220" stroke="#7a6a55" stroke-width="1.2"/>
      <rect x="430" y="155" width="340" height="220" fill="#f8f1e1" stroke-width="2"/>
      <rect x="430" y="155" width="340" height="220" fill="url(#laid)" stroke="none"/>
      <path d="M430,188 H578 M430,342 H578" stroke="#7a6a55" stroke-width="0.8"/>
      <path d="M600,155 L566,265 L600,375" stroke-width="1.4"/>
      <path d="M606,162 L574,265 L606,368" stroke="#7a6a55" stroke-width="0.6"/>
      <!-- wax seal -->
      <path d="M572,238 Q590,234 598,246 Q610,252 604,268 Q608,286 590,290 Q576,298 564,286 Q548,280 552,264 Q548,244 572,238 Z" fill="#9c3b25" fill-opacity="0.5" stroke-width="1.3"/>
      <circle cx="578" cy="265" r="15" stroke-width="1"/>
      <path d="M570,256 H586 V266 Q586,276 578,280 Q570,276 570,266 Z" stroke-width="1"/>
    </g>
  </g>

  <path d="M640,122 L592,236" fill="none" stroke="#7a6a55" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <g fill="#2b2118" font-style="italic" font-size="14">
    <text x="600" y="116">Wax seal, unbroken</text>
    <text x="210" y="420" text-anchor="middle">Address side</text>
    <text x="600" y="428" text-anchor="middle">Seal side: folded and sealed, no envelope</text>
    <text x="600" y="446" text-anchor="middle" font-size="13">Written and sealed by a Truro lawyer who owes you a favour</text>
  </g>

  <!-- Cartouche -->
  <g fill="#2b2118">
    <text x="780" y="568" text-anchor="end" font-size="21" font-variant="small-caps">Letter of Introduction</text>
    <text x="780" y="588" text-anchor="end" font-size="13" font-style="italic">Both sides of the folded letter · not to scale</text>
  </g>
</svg>
