      <rect x="120" y="160" width="60" height="110"/>
      <path d="M120,200 H180 M150,200 V150 M120,285 H180 M200,160 V270" stroke-dasharray="4 3"/>
      <path d="M196,160 h8 M196,270 h8"/>
