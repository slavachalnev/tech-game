<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a6a55" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#7a6a55" stroke-width="1.2"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#9c3b25" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- The bundle, shortened -->
  <g filter="url(#ink)" fill="none" stroke="#2b2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30,190 H770" stroke="#7a6a55" stroke-width="1"/>
    <path d="M130,169 H170 V190 H130 Z M600,169 H640 V190 H600 Z" fill="#9a7446" fill-opacity="0.35" stroke-width="1.6"/>
    <path d="M42,120 L40,127 L44,134 L41,141 L43,148 L39,155 L42,162 L40,169 H388 Q382,156 390,145 Q396,132 388,120 Z M412,120 Q420,132 414,145 Q406,156 412,169 H758 L760,162 L756,155 L759,148 L757,141 L760,134 L756,127 L758,120 Z" fill="#56514b" fill-opacity="0.35"/>
    <path d="M44,127 H388 M412,127 H756 M44,134 H388 M412,134 H756 M44,141 H388 M412,141 H756 M44,148 H388 M412,148 H756 M44,155 H388 M412,155 H756 M44,162 H388 M412,162 H756" stroke-width="1"/>
    <path d="M118,115 V174 M122,115 V174 M298,115 V174 M302,115 V174 M518,115 V174 M522,115 V174 M688,115 V174 M692,115 V174" stroke-width="1.3"/>
    <path d="M120,115 q-4,-8 3,-10 M300,115 q-4,-8 3,-10 M520,115 q-4,-8 3,-10 M690,115 q-4,-8 3,-10" stroke-width="1.2"/>
  </g>

  <!-- Section and edge of one bar (5 px = 1 mm) -->
  <rect x="80" y="300" width="190" height="65" fill="url(#hatch)"/>
  <g filter="url(#ink)" fill="none" stroke="#2b2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="300" width="190" height="65"/>
    <path d="M384,300 H736 Q742,316 734,332 Q728,350 736,365 H384 Q378,350 386,332 Q392,316 384,300 Z" fill="#56514b" fill-opacity="0.25"/>
    <path d="M392,308 q56,-2 112,0 t112,0 t112,0 M392,316 q56,2 112,0 t112,0 t112,0 M392,325 q56,-2 112,0 t112,0 t112,0 M392,334 q56,2 112,0 t112,0 t112,0 M392,343 q56,-1.5 112,0 t112,0 t112,0 M392,352 q56,2 112,0 t112,0 t112,0 M392,360 q56,-1 112,0 t112,0 t112,0" stroke="#7a6a55" stroke-width="0.8"/>
  </g>
  <g fill="#9c3b25" fill-opacity="0.6">
    <ellipse cx="112" cy="318" rx="5" ry="1.6"/><ellipse cx="164" cy="341" rx="7" ry="1.8"/><ellipse cx="222" cy="322" rx="4" ry="1.4"/><ellipse cx="246" cy="351" rx="6" ry="1.6"/>
    <path d="M420,321 q40,-4 80,0 q-40,4 -80,0 Z M540,341 q60,-4 120,0 q-60,4 -120,0 Z M600,317 q25,-3 50,0 q-25,3 -50,0 Z M450,352 q30,-3 60,0 q-30,3 -60,0 Z"/>
  </g>

  <!-- Dimensions -->
  <g stroke="#7a6a55" stroke-width="0.8" fill="none">
    <path d="M40,116 V86 M760,116 V86 M392,96 L396,86 L404,98 L408,88"/>
    <line x1="42" y1="92" x2="392" y2="92" marker-start="url(#arrow)"/>
    <line x1="408" y1="92" x2="758" y2="92" marker-end="url(#arrow)"/>
    <path d="M80,370 V392 M270,370 V392 M76,300 H52 M76,365 H52"/>
    <line x1="82" y1="386" x2="268" y2="386" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="58" y1="302" x2="58" y2="363" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M276,300 H378 M276,365 H378" stroke-dasharray="3 3"/>
  </g>
  <path d="M470,392 L476,356" fill="none" stroke="#9c3b25" stroke-width="0.8" marker-end="url(#red)"/>

  <!-- Labels -->
  <g fill="#2b2118" font-style="italic" font-size="14">
    <text x="400" y="80" text-anchor="middle">3.7 m</text>
    <text x="40" y="218">Wrought-iron flat bar, 38 × 13 mm, bundled with wire</text>
    <text x="40" y="236">100 kg in all: about 7 bars</text>
    <text x="80" y="284" font-size="15">Section of one bar</text>
    <text x="384" y="284" font-size="15">Edge of the bar</text>
    <text x="175" y="404" text-anchor="middle">38 mm</text>
    <text x="50" y="338" text-anchor="end">13 mm</text>
  </g>
  <g fill="#9c3b25" font-style="italic" font-size="13">
    <text x="440" y="406">streaks of slag along the grain:</text>
    <text x="440" y="422">ordinary merchant bar</text>
  </g>

  <!-- Scale bar for the section and edge -->
  <g stroke="#2b2118" stroke-width="0.8">
    <rect x="80" y="440" width="50" height="6" fill="#7a6a55" fill-opacity="0.5"/>
    <rect x="130" y="440" width="50" height="6" fill="none"/>
  </g>
  <g fill="#2b2118" font-style="italic" font-size="12" text-anchor="middle">
    <text x="80" y="462">0</text><text x="130" y="462">10</text><text x="180" y="462">20 mm</text>
  </g>

  <!-- Cartouche -->
  <g fill="#2b2118">
    <text x="780" y="568" text-anchor="end" font-size="21" font-variant="small-caps">Bar Iron</text>
    <text x="780" y="588" text-anchor="end" font-size="13" font-style="italic">Bundle shortened, not to scale · section and edge enlarged</text>
  </g>
</svg>
