<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Georgia, 'Times New Roman', serif">
  <title>Yard</title>
  <!--
    Site template, outdoors: a yard or site seen from the side with what is in it (the drawing of a site thing,
    e.g. a mine). Copy to visuals/<thing-id>.svg, retitle it, and replace the example shed,
    person and signpost (THING-ID, PERSON-ID, PLACE-ID are placeholders). Looking north unless you say otherwise.
    Scale: 1 m = 36 px (a person 1.7 m = 61 px); keep it for every thing in the drawing.
    Projection: a shallow oblique. With x metres across (right = east), d metres back (away from you) and
    h metres up:   X = 800 + 36x + 4d,   Y = 700 - 7d - 36h.
    So a circle on the ground is a flat ellipse, and things further back sit a little higher and to the right.
    Ground: the front edge of the yard (d = -4) is the ink line at y 728; the back of the yard (d = 20) is
    near y 560; the skyline is about y 340. Below y 728 the ground is cut away: show a cellar, a shaft or a
    quay's water there, or delete the band.
    Free ground: all of it. As you fill the yard, write here what is still free, e.g. "x 1200-1560, y 640-720".
    Order: defs; the empty yard (room); one group per thing, back to front, each after a one-line comment
    saying what and where, each starting with its paper knockout; people; ways to go; time-of-day overlays.
    Ink: filter="url(#ink)" on groups drawn in these coordinates; leave moving parts unfiltered.
  -->
  <defs>
    <!-- Hand-drawn wobble; its region is the whole drawing, so straight lines don't vanish. Keep it as is. -->
    <filter id="ink" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <pattern id="hatch-metal" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a6a55" stroke-width="0.7"/>
    </pattern>
    <pattern id="hatch-masonry" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#7a6a55"/><circle cx="6.5" cy="7" r="0.6" fill="#7a6a55"/>
    </pattern>
    <!-- Lamplight for the night overlay: fill="url(#glow)" on a circle -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e8a13a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e8a13a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8a13a" stop-opacity="0"/>
    </radialGradient>
  </defs>

