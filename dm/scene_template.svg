<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, 'Times New Roman', serif">
  <!--
    Scene template: what the player sees on arriving somewhere or meeting someone.
    Compose it from dm/drawing_parts.svg: copy a part's <g id="part-..."> (drop the id) and wrap it in
    <g transform="translate(x,y) scale(s)">. Parts carry their own ink filter, so keep them out of other
    filtered groups. Work back to front: sky, far, middle, near, labels, cartouche.

    Perspective, the one rule worth keeping: the eye is on the horizon (y=330). For a standing viewer,
    every standing person's head is on the horizon, so a figure with its feet at y is (y - 330) px tall:
    part-person at scale (y - 330) / 88, and 1 m there is (y - 330) / 1.75 px. Size everything near it
    from that. Figures read best with feet between y=365 (s 0.4) and y=470 (s 1.6).
    A higher viewpoint (a hill, a cart) puts heads below the horizon: divide the heights by eye height / 1.7 m.

    Washes are see-through, so a far line shows through a near part: set parts side by side rather
    than overlapping, or break the far line behind them.
    Keep it sparse: three to six parts, a few labels in plain words, washes pale.
  -->
  <defs>
    <!-- Hand-drawn wobble for linework: filter="url(#ink)". The region covers the whole drawing
         (userSpaceOnUse, 0 to 100%), so perfectly straight lines don't vanish. Keep it as is. -->
    <filter id="ink" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <!-- Section hatching: fill="url(#hatch-metal)" etc. -->
    <pattern id="hatch-metal" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a6a55" stroke-width="0.7"/>
    </pattern>
    <pattern id="hatch-masonry" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#7a6a55"/><circle cx="6.5" cy="7" r="0.6" fill="#7a6a55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#7a6a55" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Sky and ground washes, with ragged edges so they read as brushed on -->
  <path d="M34,330 Q26,280 32,230 Q24,170 44,120 Q150,96 290,110 Q430,92 560,106 Q690,94 760,118 Q778,180 768,240 Q776,290 766,330 Z" fill="#4f7390" fill-opacity="0.07"/>
  <path d="M34,330 H766 Q776,400 768,450 Q778,490 770,514 Q680,524 590,517 Q490,526 390,520 Q290,527 190,516 Q100,524 30,515 Q22,470 30,430 Q20,380 34,330 Z" fill="#8a7a62" fill-opacity="0.13"/>

  <!-- Horizon: distant land in faded ink -->
  <g filter="url(#ink)" fill="none" stroke="#7a6a55" stroke-width="1.2" stroke-linecap="round">
    <path d="M34,330 Q110,324 210,329 T420,325 T610,330 T766,328"/>
  </g>

  <!-- Far (feet on y 330-350): hills, distant engine houses, church towers. s 0.3-0.6, faded:
       <g opacity="0.55"> <g transform="translate(40,262) scale(0.8)"> ...part-hill... </g> </g> -->

  <!-- Middle (y 350-440): the place itself, buildings and machines. s 0.6-1.2, opacity 0.8-1 -->

  <!-- Near (y 440-510): the track, a figure or two, a cart; things close enough to touch. -->

  <!-- Ground line: the near edge of the scene -->
  <g filter="url(#ink)" fill="none" stroke="#2b2118" stroke-width="2" stroke-linecap="round">
    <path d="M26,510 Q210,504 400,509 T774,506"/>
    <path d="M66,508 l-3,-7 M70,508 l1,-8 M74,508 l4,-6 M318,508 l-3,-6 M322,508 l1,-8 M326,508 l4,-6 M604,507 l-3,-7 M608,507 l1,-8 M612,507 l4,-6" stroke="#7a6a55" stroke-width="0.8"/>
  </g>

  <!-- Labels: few, italic 13-14 px, leaders in faded ink; red ochre only for trouble the player can see -->
  <g fill="#2b2118" font-style="italic" font-size="14">
  </g>

  <!-- Cartouche: the place and the viewpoint -->
  <g fill="#2b2118">
    <text x="780" y="568" text-anchor="end" font-size="21" font-variant="small-caps">Wheal Fortune, from the Redruth track</text>
    <text x="780" y="588" text-anchor="end" font-size="13" font-style="italic">Looking west, a June morning · not to scale</text>
  </g>
</svg>
